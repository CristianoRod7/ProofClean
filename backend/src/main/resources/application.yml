spring:
  application:
    name: proofclean
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/proofclean;MODE=MySQL;DATABASE_TO_LOWER=TRUE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
server:
  port: ${SERVER_PORT:8080}
proofclean:
  jwt:
    secret: ${JWT_SECRET:proofclean-development-secret-key-proofclean-development-secret-key}
    expiration-ms: 86400000
  storage:
    original-dir: ${ORIGINAL_DIR:../uploads/original}
    masked-dir: ${MASKED_DIR:../uploads/masked}
